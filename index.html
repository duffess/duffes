    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "LYSS",
        "description": "Criação de sites profissionais para apresentar negócios e facilitar o contato com clientes.",

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      :root {
        --font-headline: "Noto Serif", Georgia, serif;
        --font-body: "Inter", system-ui, -apple-system, sans-serif;
        --font-label: "Space Grotesk", system-ui, sans-serif;
      }
      body {
        background-color: #faf6f0;
        color: #352824;
        margin: 0;
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      header {
        background-color: #faf6f0;
      }
    </style>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,300;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,300;1,400&family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

  <body class="bg-[#faf6f0] text-stone-100 antialiased">
    <div id="root">
      <style>
        .shell-container {
          max-width: 1200px;
          margin: 0 auto;
          padding: 7rem 1.5rem 4rem;
          min-height: 82vh;
          display: flex;
          flex-direction: column;
          justify-content: center;
          box-sizing: border-box;
        }
        .shell-title {
          font-size: 2.75rem;
          font-family: "Noto Serif", Georgia, serif;
          margin: 0 0 2.5rem;
          line-height: 1.12;
          color: #352824;
          font-weight: 400;
        }
        .shell-subtitle {
          font-size: 1.15rem;
          font-family: "Inter", system-ui, sans-serif;
          color: #594840;
          margin: 0;
          line-height: 1.65;
        }
        @media (min-width: 768px) {
          .shell-container {
            padding: 8rem 4rem 5rem;
          }
          .shell-title {
            font-size: 4.5rem;
          }
          .shell-subtitle {
            font-size: 1.375rem;
            max-width: 58%;
            margin-left: auto;
          }
        }
      </style>
      <div class="shell-container">
        <h1 class="shell-title">
          Me diga o que você precisa.
          <span style="font-style: italic; opacity: 0.85; font-weight: 300;">Eu cuido do resto.</span>
        </h1>
        <p class="shell-subtitle">
          Sites profissionais para apresentar seu negócio e aproximar você dos seus clientes.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
